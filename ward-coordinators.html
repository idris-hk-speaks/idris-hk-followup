<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward Coordinators | IDRIS HK 2027</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;padding:15px;}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:5px;}
table{width:100%;border-collapse:collapse;background:white;}
th,td{border:1px solid #ddd;padding:10px;text-align:left;}
th{background:#006400;color:white;}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Ward Coordinators Directory</p>
</header>

<div class="container">

<input type="text" id="search" placeholder="Search by Ward or LGA..." onkeyup="searchWard()">

<table>
<thead>
<tr>
<th>Local Government</th>
<th>Ward</th>
</tr>
</thead>

<tbody id="wardTable">
<tr><td>Ibaji</td><td>Onyedega</td></tr>
<tr><td>Ibaji</td><td>Ujeh</td></tr>
<tr><td>Ibaji</td><td>Unale</td></tr>
<tr><td>Idah</td><td>Ede Ward</td></tr>
<tr><td>Idah</td><td>Sabon Gari</td></tr>
<tr><td>Dekina</td><td>Dekina Town</td></tr>
<tr><td>Ankpa</td><td>Ankpa I</td></tr>
<tr><td>Bassa</td><td>Akakana</td></tr>
<tr><td>Ofu</td><td>Ogbonicha</td></tr>
<tr><td>Olamaboro</td><td>Okpo</td></tr>
<tr><td>Omala</td><td>Abejukolo</td></tr>
<tr><td>Igalamela/Odolu</td><td>Ajaka</td></tr>
</tbody>
</table>

</div>

<script>
function searchWard(){
let input=document.getElementById("search").value.toLowerCase();
let rows=document.querySelectorAll("#wardTable tr");

rows.forEach(row=>{
let text=row.innerText.toLowerCase();
row.style.display=text.includes(input) ? "" : "none";
});
}
</script>

</body>
</html>
