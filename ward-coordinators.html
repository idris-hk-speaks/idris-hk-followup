<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Ward Coordinators | Idris HK 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{
background:#006400;
color:white;
text-align:center;
padding:25px;
}
.container{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
h2{
color:#006400;
margin:20px 0 10px;
border-bottom:2px solid gold;
padding-bottom:5px;
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
font-weight:bold;
}
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}
th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
}
th{
background:#006400;
color:white;
}
footer{
background:#006400;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Ward Coordinators Registration</p>
</header>

<div class="container">

<h2>Register Ward Coordinator</h2>

<form action="https://formsubmit.co/info@idrishk.org" method="POST">

<input type="text" name="fullname" placeholder="Coordinator Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<select name="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" name="ward" placeholder="Ward Name" required>

<input type="text" name="community" placeholder="Community / Village">

<button type="submit">Register Coordinator</button>

</form>

<h2>Kogi East Local Government Areas</h2>

<table>
<tr>
<th>No.</th>
<th>Local Government Area</th>
</tr>

<tr><td>1</td><td>Ibaji</td></tr>
<tr><td>2</td><td>Idah</td></tr>
<tr><td>3</td><td>Dekina</td></tr>
<tr><td>4</td><td>Ankpa</td></tr>
<tr><td>5</td><td>Bassa</td></tr>
<tr><td>6</td><td>Ofu</td></tr>
<tr><td>7</td><td>Olamaboro</td></tr>
<tr><td>8</td><td>Omala</td></tr>
<tr><td>9</td><td>Igalamela/Odolu</td></tr>

</table>

</div>

<footer>
<p>© 2026 Idris HK Official Campaign Website</p>
</footer>

</body>
</html>
