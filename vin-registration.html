<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Voter Registration</title>

<style>
body{font-family:Arial;background:#eef5ee;margin:0;}
header{
background:#006400;color:#fff;text-align:center;
padding:25px;
}
.container{
max-width:750px;margin:20px auto;background:#fff;
padding:20px;border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}
input,select{
width:100%;padding:12px;margin:10px 0;
border:1px solid #ccc;border-radius:5px;
}
button{
width:100%;padding:14px;background:#006400;
color:white;border:none;border-radius:5px;
font-size:18px;font-weight:bold;
}
.note{
background:#e8f5e9;padding:10px;border-left:5px solid green;
margin-bottom:15px;
}
</style>
</head>

<body>

<header>
<h2>IDRIS HK 2027 VOTER REGISTRATION</h2>
<p>Kogi East Senatorial District</p>
</header>

<div class="container">

<div class="note">
<b>Notice:</b> Your VIN and voter information are collected only for campaign coordination and polling-unit mapping.
</div>

<form action="https://formsubmit.co/info@idrishk.org" method="POST">

<input type="text" name="fullname" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="text" name="vin" placeholder="Voter Identification Number (VIN)" required>

<select name="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" name="ward" placeholder="Ward Name" required>

<input type="text" name="polling_unit" placeholder="Polling Unit Name / Code" required>

<input type="text" name="address" placeholder="Village or Community" required>

<button type="submit">Register My PVC / VIN</button>

</form>

</div>

</body>
</html>
