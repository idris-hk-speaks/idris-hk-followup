<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Situation Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:10px;text-align:center;}
th{background:#006400;color:white;}
button{background:#006400;color:white;padding:10px 15px;border:none;border-radius:5px;}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Election Situation Room</p>
</header>

<div class="container">

<h2>Live Polling Unit Results</h2>

<button onclick="loadResults()">Refresh Results</button>

<table>
<thead>
<tr>
<th>LGA</th>
<th>Ward</th>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE YOUR FULL sb_publishable KEY HERE"
);

async function loadResults(){
  const { data, error } = await supabase
    .from("polling_results")
    .select("*")
    .order("created_at", { ascending:false });

  if(error){
    alert(error.message);
    return;
  }

  let html="";
  data.forEach(row=>{
    html += `
      <tr>
        <td>${row.lga}</td>
        <td>${row.ward}</td>
        <td>${row.polling_unit}</td>
        <td>${row.sdp_votes}</td>
        <td>${row.apc_votes}</td>
        <td>${row.pdp_votes}</td>
      </tr>`;
  });

  document.getElementById("tableBody").innerHTML = html;
}

loadResults();
</script>

</body>
</html>
