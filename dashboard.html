<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard | IDRIS HK 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
}
#message{
display:none;
background:#e8f5e9;
color:#006400;
padding:10px;
margin-top:15px;
border-left:5px solid green;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Polling Unit Agent Dashboard</p>
</header>

<div class="container">

<h2 style="color:#006400;">Upload Polling Unit Result</h2>

<form id="agentForm">

<select id="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" type="text" placeholder="Ward Name" required>

<input id="polling" type="text" placeholder="Polling Unit Name" required>

<input id="sdp" type="number" placeholder="SDP Votes" required>
<input id="apc" type="number" placeholder="APC Votes" required>
<input id="pdp" type="number" placeholder="PDP Votes" required>

<input id="ec8a" type="file" accept="image/*">

<button type="submit">Submit Result</button>

</form>

<div id="message">
✅ Result submitted successfully. Status: Pending Verification.
</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE_YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

document.getElementById("agentForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const result = {
    lga: lga.value,
    ward: ward.value,
    polling_unit: polling.value,
    sdp_votes: Number(sdp.value),
    apc_votes: Number(apc.value),
    pdp_votes: Number(pdp.value)
  };

  const { error } = await supabase.from("polling_results").insert([result]);

  if(error){
    alert(error.message);
  }else{
    document.getElementById("message").style.display="block";
    this.reset();
  }
});
</script>

</body>
</html>
