<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDRIS HK 2027 Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:1000px;margin:20px auto;padding:15px;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}
.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.card h3{color:#006400;margin:0;}
.number{font-size:28px;font-weight:bold;margin-top:10px;color:#222;}
button{
width:100%;
padding:12px;
margin:20px 0;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Campaign Dashboard</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>PVC/VIN Registered</h3>
<div class="number" id="votersCount">0</div>
</div>

<div class="card">
<h3>Volunteer Registration</h3>
<div class="number" id="volunteerCount">0</div>
</div>

<div class="card">
<h3>Polling Results</h3>
<div class="number" id="resultCount">0</div>
</div>

<div class="card">
<h3>Observer Reports</h3>
<div class="number" id="observerCount">0</div>
</div>

</div>

<button onclick="loadDashboard()">Refresh Dashboard</button>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE_YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

async function loadDashboard(){

let {count:voters} = await supabase
.from("voters")
.select("*",{count:"exact",head:true});

let {count:volunteers} = await supabase
.from("volunteers")
.select("*",{count:"exact",head:true});

let {count:results} = await supabase
.from("polling_results")
.select("*",{count:"exact",head:true});

let {count:reports} = await supabase
.from("observer_reports")
.select("*",{count:"exact",head:true});

document.getElementById("votersCount").innerHTML=voters || 0;
document.getElementById("volunteerCount").innerHTML=volunteers || 0;
document.getElementById("resultCount").innerHTML=results || 0;
document.getElementById("observerCount").innerHTML=reports || 0;

}

loadDashboard();
</script>

</body>
</html>
