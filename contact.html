<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Idris HK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{
  background:#006400;
  color:white;
  text-align:center;
  padding:20px;
}
.container{
  max-width:700px;
  margin:30px auto;
  background:white;
  padding:25px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}
h2{color:#006400;margin-bottom:15px;}
.info p{margin:10px 0;font-size:17px;}
form input, form textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}
button{
  width:100%;
  padding:14px;
  background:#006400;
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
  font-weight:bold;
}
footer{
  background:#006400;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:30px;
}
</style>
</head>

<body>

<header>
  <h1>Contact Idris HK</h1>
  <p>We would love to hear from you.</p>
</header>

<div class="container">

  <div class="info">
    <h2>Contact Information</h2>

    <p>📍 Ajaka, Igalamela-Odolu LGA, Kogi State, Nigeria.</p>

    <p>📞 Phone: +234 704 412 6064</p>

    <p>📧 Email: info@idrishk.org</p>

    <p>🌐 Website: www.idrishk.org</p>
  </div>

  <h2>Send Us a Message</h2>

  <form action="https://formsubmit.co/info@idrishk.org" method="POST">
    <input type="text" name="Name" placeholder="Your Full Name" required>

    <input type="email" name="Email" placeholder="Your Email Address" required>

    <input type="tel" name="Phone" placeholder="Your Phone Number">

    <textarea name="Message" rows="6" placeholder="Write your message here..." required></textarea>

    <button type="submit">Send Message</button>
  </form>

</div>

<footer>
  © 2026 Idris HK Official Website. All Rights Reserved.
</footer>

</body>
</html>
