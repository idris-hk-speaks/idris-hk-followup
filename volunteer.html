<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer | Idris HK 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}
header{
    background:#006400;
    color:white;
    text-align:center;
    padding:35px 20px;
}
header h1{
    color:gold;
}
.container{
    width:90%;
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}
h2{
    color:#006400;
    margin-bottom:10px;
}
input, select, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}
button{
    width:100%;
    padding:14px;
    background:#006400;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    font-weight:bold;
}
footer{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>Join Idris HK 2027 Campaign</h1>
    <p>Become a Volunteer for a Better Kogi East.</p>
</header>

<div class="container">

<h2>Volunteer Registration Form</h2>

<form action="https://formsubmit.co/info@idrishk.org" method="POST">

<input type="text" name="Full Name" placeholder="Full Name" required>

<input type="tel" name="Phone Number" placeholder="Phone Number" required>

<input type="email" name="Email" placeholder="Email Address">

<input type="text" name="Community" placeholder="Community / Ward" required>

<input type="text" name="LGA" placeholder="Local Government Area" required>

<select name="Volunteer Area" required>
<option value="">Select Area of Interest</option>
<option>Media & Publicity</option>
<option>Youth Mobilization</option>
<option>Women Mobilization</option>
<option>Community Outreach</option>
<option>Campaign Support</option>
</select>

<textarea name="Message" rows="5" placeholder="Why do you want to volunteer?"></textarea>

<button type="submit">Register as Volunteer</button>

</form>

</div>

<footer>
<p>© 2026 Idris HK Official Website | Together for Kogi East.</p>
</footer>

</body>
</html>
