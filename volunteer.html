<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer | Idris HK 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
background:#004d00;
padding:10px;
}
.menu a{
background:#008000;
color:white;
text-decoration:none;
padding:8px 12px;
border-radius:5px;
font-size:13px;
}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{color:#006400;text-align:center;margin-bottom:15px;}

input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
font-weight:bold;
}

#success{
display:none;
background:#e8f5e9;
color:#006400;
padding:10px;
margin-top:15px;
border-left:5px solid green;
}

footer{
background:#006400;
color:white;
text-align:center;
padding:20px;
margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Volunteer Registration</p>
</header>

<div class="menu">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="news.html">News</a>
<a href="events.html">Events</a>
<a href="team.html">Team</a>
<a href="volunteer.html">Volunteer</a>
<a href="contact.html">Contact</a>
</div>

<div class="container">

<h2>Join the Campaign</h2>

<form id="volunteerForm">

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="email" placeholder="Email Address">

<select required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" placeholder="Ward Name" required>

<select required>
<option value="">Choose Volunteer Role</option>
<option>Campaign Volunteer</option>
<option>Ward Coordinator</option>
<option>Polling Unit Agent</option>
<option>Youth Mobilizer</option>
<option>Women Mobilizer</option>
<option>Media Team</option>
</select>

<textarea placeholder="Why do you want to join the campaign?" rows="4"></textarea>

<button type="submit">Register as Volunteer</button>

</form>

<div id="success">
✅ Thank you! Your volunteer registration has been submitted successfully.
</div>

</div>

<footer>
<p>© 2026 Idris HK Official Campaign Website</p>
</footer>

<script>
document.getElementById("volunteerForm").addEventListener("submit", function(e){
e.preventDefault();
document.getElementById("success").style.display="block";
this.reset();
});
</script>

</body>
</html>
