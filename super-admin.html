<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER ADMIN | IDRIS HK 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
button{background:#006400;color:white;padding:10px;border:none;border-radius:5px;margin:5px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{background:#006400;color:white;}
</style>
</head>
<body>

<header>
<h1>SUPER ADMIN PANEL</h1>
<p>IDRIS HK 2027 Campaign Control Center</p>
</header>

<div class="container">

<h2>Dashboard</h2>

<button onclick="loadVoters()">PVC/VIN Registrations</button>
<button onclick="loadResults()">Polling Results</button>

<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE YOUR FULL sb_publishable KEY HERE"
);

async function loadVoters(){
const {data}=await supabase.from("voters").select("*");

tableHead.innerHTML="<tr><th>Name</th><th>Phone</th><th>LGA</th><th>Ward</th></tr>";

let html="";
data.forEach(v=>{
html += `<tr>
<td>${v.full_name}</td>
<td>${v.phone}</td>
<td>${v.lga}</td>
<td>${v.ward}</td>
</tr>`;
});

tableBody.innerHTML=html;
}

async function loadResults(){
const {data}=await supabase.from("polling_results").select("*");

tableHead.innerHTML="<tr><th>LGA</th><th>Polling Unit</th><th>SDP</th><th>APC</th><th>PDP</th></tr>";

let html="";
data.forEach(r=>{
html += `<tr>
<td>${r.lga}</td>
<td>${r.polling_unit}</td>
<td>${r.sdp_votes}</td>
<td>${r.apc_votes}</td>
<td>${r.pdp_votes}</td>
</tr>`;
});

tableBody.innerHTML=html;
}
</script>

</body>
</html>
