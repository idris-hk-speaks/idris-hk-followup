<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:#fff;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;background:#fff;padding:20px;border-radius:10px;}
input,button{width:100%;padding:12px;margin:10px 0;border-radius:5px;}
button{background:#006400;color:#fff;border:none;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{background:#006400;color:white;}
#dashboard{display:none;}
</style>
</head>
<body>

<header>
<h1>🔐 IDRIS HK 2027 ADMIN DASHBOARD</h1>
</header>

<div class="container">

<div id="loginBox">
<h2>Admin Login</h2>
<input type="password" id="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard">
<h2>Polling Unit Results</h2>
<table>
<thead>
<tr>
<th>LGA</th>
<th>Ward</th>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE YOUR FULL sb_publishable KEY HERE"
);

const ADMIN_PASSWORD = "IdrisHK2027SDP";

function login(){
  if(document.getElementById("password").value===ADMIN_PASSWORD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("dashboard").style.display="block";
    loadResults();
  }else{
    alert("Wrong password");
  }
}

async function loadResults(){
  const {data,error}=await supabase.from("polling_results").select("*");
  if(error){alert(error.message);return;}

  let html="";
  data.forEach(r=>{
    html += `<tr>
      <td>${r.lga}</td>
      <td>${r.ward}</td>
      <td>${r.polling_unit}</td>
      <td>${r.sdp_votes}</td>
      <td>${r.apc_votes}</td>
      <td>${r.pdp_votes}</td>
    </tr>`;
  });

  document.getElementById("tableBody").innerHTML=html;
}
</script>

</body>
</html>
