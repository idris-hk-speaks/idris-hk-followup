<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVC / VIN Registration | IDRIS HK 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#004d00;
}

#message{
display:none;
padding:12px;
margin-top:15px;
border-radius:5px;
font-weight:bold;
}

.success{
background:#e8f5e9;
color:#006400;
}

.error{
background:#fdecea;
color:#b00020;
}

footer{
background:#006400;
color:white;
text-align:center;
padding:20px;
margin-top:20px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East PVC / VIN Registration Portal</p>
</header>

<div class="container">

<h2 style="color:#006400;text-align:center;">Register Your PVC / VIN</h2>

<form id="voterForm">

<input id="fullname" type="text" placeholder="Full Name" required>

<input id="phone" type="tel" placeholder="Phone Number" required>

<input id="vin" type="text" placeholder="Voter Identification Number (VIN)" required>

<select id="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" type="text" placeholder="Ward Name" required>

<input id="polling" type="text" placeholder="Polling Unit Name" required>

<button type="submit">Register PVC / VIN</button>

</form>

<div id="message"></div>

</div>

<footer>
<p>© 2026 IDRIS HK Official Campaign Website</p>
</footer>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

document.getElementById("voterForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const message = document.getElementById("message");

  const voter = {
    full_name: document.getElementById("fullname").value,
    phone: document.getElementById("phone").value,
    vin: document.getElementById("vin").value,
    lga: document.getElementById("lga").value,
    ward: document.getElementById("ward").value,
    polling_unit: document.getElementById("polling").value
  };

  const { error } = await supabase.from("voters").insert([voter]);

  if (error) {
    message.className = "error";
    message.style.display = "block";
    message.innerHTML = "Registration failed: " + error.message;
  } else {
    message.className = "success";
    message.style.display = "block";
    message.innerHTML = "✅ PVC / VIN Registration Successful!";
    document.getElementById("voterForm").reset();
  }
});
</script>

</body>
</html>
