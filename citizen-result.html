<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Polling Unit Result Checker</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{
  background:#006400;
  color:white;
  text-align:center;
  padding:20px;
}
header h1{color:gold;}
.container{
  max-width:800px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:10px;
}
select,input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}
button{
  width:100%;
  padding:14px;
  background:#006400;
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
}
.result{
  margin-top:20px;
  background:#eef8ee;
  padding:15px;
  border-left:5px solid green;
  border-radius:8px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}
th{
  background:#006400;
  color:white;
}
img{
  width:100%;
  border-radius:8px;
  margin-top:15px;
}
footer{
  background:#006400;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>KOGI EAST RESULT CHECKER</h1>
  <p>Search Polling Unit Results</p>
</header>

<div class="container">

<select>
<option>Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" placeholder="Enter Ward Name">

<input type="text" placeholder="Enter Polling Unit Name">

<button>Check Result</button>

<div class="result">

<h3>Polling Unit Result</h3>

<table>
<tr>
<th>Party</th>
<th>Votes</th>
</tr>

<tr><td>SDP</td><td>412</td></tr>
<tr><td>APC</td><td>245</td></tr>
<tr><td>PDP</td><td>88</td></tr>
<tr><td>LP</td><td>15</td></tr>

</table>

<p><b>Ward:</b> Ujeh</p>
<p><b>LGA:</b> Ibaji</p>
<p><b>Status:</b> Verified Result</p>

<h3>EC8A Result Sheet</h3>

<img src="ec8a-sample.jpg" alt="EC8A Result Sheet">

</div>

</div>

<footer>
© 2026 Idris HK Official Election Portal
</footer>

</body>
</html>
