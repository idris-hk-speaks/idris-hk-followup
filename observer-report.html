<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer Report | IDRIS HK 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
}
input,select,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
}
#message{
display:none;
background:#e8f5e9;
color:#006400;
padding:10px;
margin-top:15px;
border-left:5px solid green;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Election Observer & Incident Report</p>
</header>

<div class="container">

<form id="observerForm">

<input id="fullname" type="text" placeholder="Full Name" required>

<input id="phone" type="tel" placeholder="Phone Number" required>

<select id="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" type="text" placeholder="Ward Name" required>

<input id="polling" type="text" placeholder="Polling Unit Name" required>

<textarea id="incident" rows="5"
placeholder="Describe the incident (violence, vote buying, intimidation, missing materials, etc.)" required></textarea>

<button type="submit">Submit Report</button>

</form>

<div id="message">
✅ Incident report submitted successfully.
</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE_YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

document.getElementById("observerForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const report = {
    full_name: fullname.value,
    phone: phone.value,
    lga: lga.value,
    ward: ward.value,
    polling_unit: polling.value,
    incident: incident.value
  };

  const { error } = await supabase
    .from("observer_reports")
    .insert([report]);

  if (error) {
    alert("Submission failed: " + error.message);
  } else {
    document.getElementById("message").style.display = "block";
    this.reset();
  }
});
</script>

</body>
</html>
