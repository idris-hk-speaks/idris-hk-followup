<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Observer Report | Idris HK 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Arial,sans-serif;background:#f4f4f4;}
header{
  background:#006400;
  color:white;
  text-align:center;
  padding:20px;
}
header h1{color:gold;}
.container{
  max-width:750px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:10px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}
button{
  width:100%;
  padding:14px;
  background:#006400;
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
}
.note{
  background:#FFF8DC;
  padding:10px;
  border-left:5px solid orange;
  margin-bottom:15px;
}
footer{
  background:#006400;
  color:white;
  text-align:center;
  padding:15px;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>Election Observer Report</h1>
  <p>Kogi East Senatorial District - Situation Room</p>
</header>

<div class="container">

<div class="note">
<b>Report any incident observed at your polling unit.</b>
</div>

<form action="https://formsubmit.co/info@idrishk.org" method="POST" enctype="multipart/form-data">

<input type="text" name="observer_name" placeholder="Observer / Agent Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<select name="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" name="ward" placeholder="Ward Name" required>

<input type="text" name="polling_unit" placeholder="Polling Unit Name / Code" required>

<select name="incident_type" required>
<option value="">Select Incident Type</option>
<option>Vote Buying</option>
<option>Violence</option>
<option>Ballot Box Snatching</option>
<option>Late Arrival of Officials</option>
<option>Intimidation</option>
<option>Other</option>
</select>

<textarea name="report" rows="6" placeholder="Describe what happened..." required></textarea>

<label>Upload Photo or Video Evidence</label>
<input type="file" name="evidence" accept="image/*,video/*">

<button type="submit">Submit Incident Report</button>

</form>

</div>

<footer>
© 2026 Idris HK Election Situation Room
</footer>

</body>
</html>
