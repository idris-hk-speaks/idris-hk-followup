<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Idris HK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#006400;
    color:white;
    text-align:center;
    padding:25px;
}
.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}
.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.caption{
    text-align:center;
    font-weight:bold;
    color:#006400;
    margin-top:8px;
}
footer{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>
</head>

<body>

<header>
    <h1>Idris HK Gallery</h1>
    <p>Photos from Community Development and Public Engagements</p>
</header>

<div class="container">

<div class="gallery">

<div>
<img src="gallery1.jpg" alt="Idris HK Community Visit">
<p class="caption">Community Development Visit</p>
</div>

<div>
<img src="gallery2.jpg" alt="Idris HK Youth Empowerment">
<p class="caption">Youth Empowerment Programme</p>
</div>

<div>
<img src="gallery3.jpg" alt="Idris HK Educational Support">
<p class="caption">Educational Support Initiative</p>
</div>

<div>
<img src="gallery4.jpg" alt="Idris HK Healthcare Outreach">
<p class="caption">Healthcare Outreach</p>
</div>

<div>
<img src="gallery5.jpg" alt="Idris HK Public Event">
<p class="caption">Meeting with Community Members</p>
</div>

<div>
<img src="gallery6.jpg" alt="Idris HK Humanitarian Project">
<p class="caption">Humanitarian Project</p>
</div>

</div>

</div>

<footer>
    <p>© 2026 Idris HK Official Website. All Rights Reserved.</p>
</footer>

</body>
</html>
