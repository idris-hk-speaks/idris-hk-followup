<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDRIS HK 2027 Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
input{width:100%;padding:12px;margin:10px 0;}
button{width:100%;padding:12px;background:#006400;color:white;border:none;border-radius:5px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ddd;padding:8px;text-align:center;}
th{background:#006400;color:white;}
#dashboard{display:none;}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Campaign Admin Panel</p>
</header>

<div class="container">

<div id="login">
<h2>Admin Login</h2>

<input type="password" id="password" placeholder="Enter Admin Password">

<button onclick="login()">Login</button>
</div>

<div id="dashboard">
<h2>Uploaded Polling Results</h2>

<table>
<thead>
<tr>
<th>LGA</th>
<th>Ward</th>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>

<tbody id="resultsTable"></tbody>

</table>

</div>

</div>

<script>
const supabase = window.supabase.createClient(
"https://unqdjgjippexmwrcwphh.supabase.co",
"PASTE YOUR FULL sb_publishable KEY HERE"
);

function login(){
if(document.getElementById("password").value==="IDRISHK2027"){
document.getElementById("login").style.display="none";
document.getElementById("dashboard").style.display="block";
loadResults();
}else{
alert("Wrong password.");
}
}

async function loadResults(){
const { data } = await supabase.from("polling_results").select("*");

let html="";
data.forEach(r=>{
html+=`<tr>
<td>${r.lga}</td>
<td>${r.ward}</td>
<td>${r.polling_unit}</td>
<td>${r.sdp_votes}</td>
<td>${r.apc_votes}</td>
<td>${r.pdp_votes}</td>
</tr>`;
});

document.getElementById("resultsTable").innerHTML=html;
}
</script>

</body>
</html>
