<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Results</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
.container{max-width:700px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
input,button{width:100%;padding:12px;margin:10px 0;}
button{background:#006400;color:white;border:none;border-radius:5px;}
#result{display:none;background:#e8f5e9;padding:15px;margin-top:15px;}
</style>
</head>

<body>

<header>
<h2>Kogi East Result Checker</h2>
</header>

<div class="container">

<input type="text" id="polling" placeholder="Enter Polling Unit (Example: PU001)">

<button onclick="checkResult()">Check Result</button>

<div id="result">
<h3 id="pu"></h3>
<p><b>SDP:</b> <span id="sdp"></span></p>
<p><b>APC:</b> <span id="apc"></span></p>
<p><b>PDP:</b> <span id="pdp"></span></p>
</div>

</div>

<script>
function checkResult(){
let result = localStorage.getItem(document.getElementById("polling").value);

if(result){
let data = JSON.parse(result);
document.getElementById("pu").innerHTML = data.polling;
document.getElementById("sdp").innerHTML = data.sdp;
document.getElementById("apc").innerHTML = data.apc;
document.getElementById("pdp").innerHTML = data.pdp;
document.getElementById("result").style.display = "block";
}else{
alert("No result found.");
}
}
</script>

</body>
</html>
