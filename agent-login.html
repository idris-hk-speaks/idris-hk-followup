<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polling Unit Agent Login</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
}
header{
  background:#006400;
  color:#fff;
  text-align:center;
  padding:25px;
}
.container{
  max-width:500px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}
input,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}
button{
  width:100%;
  padding:14px;
  background:#006400;
  color:white;
  border:none;
  border-radius:5px;
  font-size:18px;
}
</style>
</head>

<body>

<header>
<h2>IDRIS HK 2027 AGENT LOGIN</h2>
<p>Kogi East Polling Unit Agents Portal</p>
</header>

<div class="container">

<form action="upload-result.html" method="GET">

<input type="text" name="agentid"
placeholder="Agent ID" required>

<input type="password" name="password"
placeholder="Password" required>

<select name="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" name="ward"
placeholder="Ward Name" required>

<input type="text" name="pollingunit"
placeholder="Polling Unit Name" required>

<button type="submit">Login</button>

</form>

</div>

</body>
</html>
