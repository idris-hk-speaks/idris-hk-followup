<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Login | IDRIS HK 2027</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{
max-width:500px;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Campaign Agent Login</p>
</header>

<div class="container">

<h2 style="color:#006400;">Login</h2>

<select id="role">
<option>Polling Unit Agent</option>
<option>Ward Coordinator</option>
<option>LGA Coordinator</option>
</select>

<input id="phone" type="tel" placeholder="Phone Number">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>
function login(){
const phone=document.getElementById("phone").value;
const password=document.getElementById("password").value;

if(phone && password){
window.location.href="agent-dashboard.html";
}else{
alert("Enter your phone number and password.");
}
}
</script>

</body>
</html>
