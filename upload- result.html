<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Polling Unit Result</title>

<style>
body{font-family:Arial;background:#eef5ee;margin:0;}
header{
background:#006400;
color:#fff;
text-align:center;
padding:20px;
}
.container{
max-width:700px;
margin:20px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}
button{
width:100%;
padding:14px;
background:#006400;
color:#fff;
border:none;
border-radius:5px;
font-size:18px;
font-weight:bold;
}
h3{color:#006400;}
</style>
</head>

<body>

<header>
<h2>KOGI EAST RESULT UPLOAD PORTAL</h2>
<p>Polling Unit Agent Result Submission (EC8A)</p>
</header>

<div class="container">

<h3>Polling Unit Information</h3>

<select required>
<option>Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" placeholder="Ward Name" required>
<input type="text" placeholder="Polling Unit Name / Code" required>

<h3>Enter Votes</h3>

<input type="number" placeholder="SDP Votes" required>
<input type="number" placeholder="APC Votes" required>
<input type="number" placeholder="PDP Votes" required>
<input type="number" placeholder="LP Votes">
<input type="number" placeholder="AAC Votes">
<input type="number" placeholder="Other Party Votes">

<h3>Upload EC8A Result Sheet</h3>

<input type="file" accept="image/*" required>

<button type="submit">Upload Result</button>

</div>

</body>
</html>
