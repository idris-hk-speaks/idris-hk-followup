<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Polling Unit Result</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#006400;color:#fff;text-align:center;padding:20px}
.container{max-width:700px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
input,select{width:100%;padding:12px;margin:8px 0}
button{width:100%;padding:14px;background:#006400;color:#fff;border:none;border-radius:5px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#006400;color:#fff}
</style>
</head>
<body>

<header>
<h2>KOGI EAST RESULT UPLOAD</h2>
</header>

<div class="container">

<select id="lga">
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" placeholder="Ward Name">
<input id="pu" placeholder="Polling Unit">

<input id="sdp" type="number" placeholder="SDP Votes">
<input id="apc" type="number" placeholder="APC Votes">
<input id="pdp" type="number" placeholder="PDP Votes">

<button onclick="uploadResult()">Upload Result</button>

<table>
<thead>
<tr>
<th>LGA</th><th>Polling Unit</th><th>SDP</th><th>APC</th><th>PDP</th>
</tr>
</thead>
<tbody id="resultTable"></tbody>
</table>

</div>

<script>
function uploadResult(){
const row = `
<tr>
<td>${lga.value}</td>
<td>${pu.value}</td>
<td>${sdp.value}</td>
<td>${apc.value}</td>
<td>${pdp.value}</td>
</tr>`;

document.getElementById("resultTable").innerHTML += row;

alert("Result Uploaded Successfully!");

ward.value="";
pu.value="";
sdp.value="";
apc.value="";
pdp.value="";
}
</script>

</body>
</html>
