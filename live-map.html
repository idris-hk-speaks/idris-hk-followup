<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Live Election Dashboard | IDRIS HK 2027</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}
.container{max-width:900px;margin:20px auto;padding:15px;}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-bottom:20px;
}
.box{
background:white;
padding:15px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.box h3{color:#006400;margin:0;}
.box p{font-size:22px;font-weight:bold;margin:8px 0;}

table{
width:100%;
border-collapse:collapse;
background:white;
}
th,td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}
th{
background:#006400;
color:white;
}

button{
background:#006400;
color:white;
padding:12px;
border:none;
border-radius:6px;
width:100%;
margin:15px 0;
font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Live Election Dashboard</p>
</header>

<div class="container">

<div class="summary">
<div class="box">
<h3>SDP</h3>
<p id="totalSDP">0</p>
</div>

<div class="box">
<h3>APC</h3>
<p id="totalAPC">0</p>
</div>

<div class="box">
<h3>PDP</h3>
<p id="totalPDP">0</p>
</div>

<div class="box">
<h3>Polling Units</h3>
<p id="totalPU">0</p>
</div>
</div>

<button onclick="loadDashboard()">Refresh Dashboard</button>

<table>
<thead>
<tr>
<th>LGA</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>

<tbody id="dashboardTable"></tbody>

</table>

</div>

<script>
const supabase = window.supabase.createClient(
"https://unqdjgjippexmwrcwphh.supabase.co",
"PASTE_YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

async function loadDashboard(){

const { data, error } = await supabase
.from("polling_results")
.select("*");

if(error){
alert(error.message);
return;
}

let sdp=0, apc=0, pdp=0;

let lgas={
"Ibaji":{sdp:0,apc:0,pdp:0},
"Idah":{sdp:0,apc:0,pdp:0},
"Dekina":{sdp:0,apc:0,pdp:0},
"Ankpa":{sdp:0,apc:0,pdp:0},
"Bassa":{sdp:0,apc:0,pdp:0},
"Ofu":{sdp:0,apc:0,pdp:0},
"Olamaboro":{sdp:0,apc:0,pdp:0},
"Omala":{sdp:0,apc:0,pdp:0},
"Igalamela/Odolu":{sdp:0,apc:0,pdp:0}
};

data.forEach(r=>{
sdp += r.sdp_votes;
apc += r.apc_votes;
pdp += r.pdp_votes;

if(lgas[r.lga]){
lgas[r.lga].sdp += r.sdp_votes;
lgas[r.lga].apc += r.apc_votes;
lgas[r.lga].pdp += r.pdp_votes;
}
});

document.getElementById("totalSDP").innerHTML=sdp;
document.getElementById("totalAPC").innerHTML=apc;
document.getElementById("totalPDP").innerHTML=pdp;
document.getElementById("totalPU").innerHTML=data.length;

let html="";
Object.keys(lgas).forEach(name=>{
html += `
<tr>
<td>${name}</td>
<td>${lgas[name].sdp}</td>
<td>${lgas[name].apc}</td>
<td>${lgas[name].pdp}</td>
</tr>`;
});

document.getElementById("dashboardTable").innerHTML=html;
}

loadDashboard();
</script>

</body>
</html>
