<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Results - Idris HK 2027</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f4f4;
}
header{
    background:#006400;
    color:white;
    text-align:center;
    padding:20px;
}
header h2{
    color:gold;
    margin:0;
}
.container{
    max-width:700px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
input,select{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:14px;
    background:#006400;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}
button:hover{
    background:#004d00;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}
th{
    background:#006400;
    color:white;
}
#message{
    display:none;
    background:#e8f5e9;
    color:#006400;
    padding:10px;
    margin-top:15px;
    border-left:5px solid green;
}
</style>
</head>

<body>

<header>
    <h2>IDRIS HK 2027</h2>
    <p>Kogi East Polling Unit Result Upload</p>
</header>

<div class="container">

<select id="lga">
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" id="ward" placeholder="Ward Name">
<input type="text" id="polling" placeholder="Polling Unit Name">

<input type="number" id="sdp" placeholder="SDP Votes">
<input type="number" id="apc" placeholder="APC Votes">
<input type="number" id="pdp" placeholder="PDP Votes">

<button onclick="uploadResult()">Upload Result</button>

<div id="message">
    ✅ Result uploaded successfully.
</div>

<table>
<thead>
<tr>
<th>LGA</th>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>

<tbody id="resultTable"></tbody>
</table>

</div>

<script>
function uploadResult(){

const lga = document.getElementById("lga").value;
const polling = document.getElementById("polling").value;
const sdp = document.getElementById("sdp").value;
const apc = document.getElementById("apc").value;
const pdp = document.getElementById("pdp").value;

if(lga=="" || polling=="" || sdp=="" || apc=="" || pdp==""){
alert("Please fill all fields.");
return;
}

const table = document.getElementById("resultTable");

table.innerHTML += `
<tr>
<td>${lga}</td>
<td>${polling}</td>
<td>${sdp}</td>
<td>${apc}</td>
<td>${pdp}</td>
</tr>
`;

document.getElementById("message").style.display="block";

document.getElementById("ward").value="";
document.getElementById("polling").value="";
document.getElementById("sdp").value="";
document.getElementById("apc").value="";
document.getElementById("pdp").value="";
}
</script>

</body>
</html>
