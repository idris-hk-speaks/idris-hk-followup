<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Polling Unit Results | IDRIS HK 2027</title>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;}
header{background:#006400;color:white;text-align:center;padding:20px;}
header h1{color:gold;}

.container{
max-width:700px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:14px;
background:#006400;
color:white;
border:none;
border-radius:5px;
font-size:18px;
font-weight:bold;
}

#message{
display:none;
padding:10px;
margin-top:15px;
background:#e8f5e9;
color:#006400;
border-left:5px solid green;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
<h1>IDRIS HK 2027</h1>
<p>Kogi East Polling Unit Result Upload</p>
</header>

<div class="container">

<form id="resultForm">

<select id="lga" required>
<option value="">Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" type="text" placeholder="Ward Name" required>

<input id="polling" type="text" placeholder="Polling Unit Name" required>

<input id="sdp" type="number" placeholder="SDP Votes" required>

<input id="apc" type="number" placeholder="APC Votes" required>

<input id="pdp" type="number" placeholder="PDP Votes" required>

<button type="submit">Upload Result</button>

</form>

<div id="message">✅ Result uploaded successfully.</div>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://unqdjgjippexmwrcwphh.supabase.co",
  "PASTE_YOUR_FULL_PUBLISHABLE_KEY_HERE"
);

document.getElementById("resultForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const result = {
    lga: document.getElementById("lga").value,
    ward: document.getElementById("ward").value,
    polling_unit: document.getElementById("polling").value,
    sdp_votes: parseInt(document.getElementById("sdp").value),
    apc_votes: parseInt(document.getElementById("apc").value),
    pdp_votes: parseInt(document.getElementById("pdp").value)
  };

  const { error } = await supabase.from("polling_results").insert([result]);

  if (error) {
    alert("Upload failed: " + error.message);
  } else {
    document.getElementById("message").style.display = "block";
    document.getElementById("resultForm").reset();
  }
});
</script>

</body>
</html>
