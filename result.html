<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kogi East Polling Unit Results</title>

<style>
body{font-family:Arial;background:#f2f2f2;margin:0;}
header{background:#006400;color:#fff;padding:20px;text-align:center;}
.container{padding:15px;}
select,input{
width:100%;padding:12px;margin:10px 0;
border:1px solid #ccc;border-radius:5px;
}
button{
width:100%;padding:12px;background:#006400;
color:white;border:none;border-radius:5px;
font-size:18px;
}
.result{
background:white;padding:15px;margin-top:20px;
border-radius:10px;
}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #ddd;padding:10px;text-align:center;}
th{background:#006400;color:white;}
</style>
</head>

<body>

<header>
<h2>KOGI EAST LIVE POLLING UNIT RESULTS</h2>
<p>Senatorial Election Result Upload Center</p>
</header>

<div class="container">

<select>
<option>Select Local Government</option>
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input type="text" placeholder="Enter Ward Name">
<input type="text" placeholder="Enter Polling Unit Name">

<input type="number" placeholder="SDP (Idris HK) Votes">
<input type="number" placeholder="APC Votes">
<input type="number" placeholder="PDP Votes">
<input type="number" placeholder="LP Votes">

<button>Upload Result</button>

<div class="result">
<h3>Uploaded Results</h3>

<table>
<tr>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>

<tr>
<td>Uchuchu PU 001</td>
<td>412</td>
<td>245</td>
<td>88</td>
</tr>

</table>

</div>

</div>

</body>
</html>
