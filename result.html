<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Polling Unit Result</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4;}
header{background:#006400;color:white;text-align:center;padding:20px;}
.container{max-width:700px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
input,select{width:100%;padding:12px;margin:8px 0;}
button{width:100%;padding:14px;background:#006400;color:white;border:none;border-radius:5px;}
table{width:100%;margin-top:20px;border-collapse:collapse;}
th,td{border:1px solid #ccc;padding:10px;text-align:center;}
th{background:#006400;color:white;}
</style>
</head>

<body>

<header>
<h2>KOGI EAST RESULT UPLOAD</h2>
</header>

<div class="container">

<select id="lga">
<option>Ibaji</option>
<option>Idah</option>
<option>Dekina</option>
<option>Ankpa</option>
<option>Bassa</option>
<option>Ofu</option>
<option>Olamaboro</option>
<option>Omala</option>
<option>Igalamela/Odolu</option>
</select>

<input id="ward" placeholder="Ward Name">
<input id="polling" placeholder="Polling Unit">

<input id="sdp" type="number" placeholder="SDP Votes">
<input id="apc" type="number" placeholder="APC Votes">
<input id="pdp" type="number" placeholder="PDP Votes">

<button id="uploadBtn">Upload Result</button>

<table>
<thead>
<tr>
<th>LGA</th>
<th>Polling Unit</th>
<th>SDP</th>
<th>APC</th>
<th>PDP</th>
</tr>
</thead>
<tbody id="resultTable"></tbody>
</table>

</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");

uploadBtn.addEventListener("click", function () {
  const lga = document.getElementById("lga").value;
  const polling = document.getElementById("polling").value;
  const sdp = document.getElementById("sdp").value;
  const apc = document.getElementById("apc").value;
  const pdp = document.getElementById("pdp").value;

  if (!polling || !sdp || !apc || !pdp) {
    alert("Please fill all required fields.");
    return;
  }

  const table = document.getElementById("resultTable");
  table.innerHTML += `
    <tr>
      <td>${lga}</td>
      <td>${polling}</td>
      <td>${sdp}</td>
      <td>${apc}</td>
      <td>${pdp}</td>
    </tr>`;

  alert("Result uploaded successfully!");

  document.getElementById("ward").value = "";
  document.getElementById("polling").value = "";
  document.getElementById("sdp").value = "";
  document.getElementById("apc").value = "";
  document.getElementById("pdp").value = "";
});
</script>

</body>
</html>
